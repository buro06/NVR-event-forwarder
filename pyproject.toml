[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvr-event-push"
version = "0.1.0"
description = "Forward Hikvision/Annke NVR motion and smart events to HTTP GET webhooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "questionary>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nvr-event-push = "nvr_event_push.cli:main"

[tool.setuptools]
packages = ["nvr_event_push"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
